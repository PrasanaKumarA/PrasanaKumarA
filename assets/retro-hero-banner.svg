<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f6fd6"/>
      <stop offset="100%" stop-color="#7fb8ff"/>
    </linearGradient>
    <pattern id="brick" width="40" height="20" patternUnits="userSpaceOnUse">
      <rect width="40" height="20" fill="#c84c0c"/>
      <rect width="40" height="2" y="0" fill="#8a3200"/>
      <rect width="2" height="20" x="0" fill="#8a3200"/>
      <rect width="2" height="20" x="20" fill="#8a3200"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#sky)"/>

  <!-- drifting clouds -->
  <g fill="#ffffff" opacity="0.95">
    <g>
      <ellipse cx="0" cy="60" rx="30" ry="14"/>
      <ellipse cx="25" cy="55" rx="22" ry="16"/>
      <ellipse cx="-25" cy="58" rx="20" ry="12"/>
      <animateTransform attributeName="transform" type="translate" from="1300 0" to="-200 0" dur="26s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="0" cy="42" rx="26" ry="12"/>
      <ellipse cx="20" cy="38" rx="18" ry="13"/>
      <animateTransform attributeName="transform" type="translate" from="-200 0" to="1300 0" dur="34s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- title -->
  <text x="600" y="88" text-anchor="middle" font-family="Courier New, monospace" font-weight="bold"
        font-size="42" fill="#ffffff" stroke="#00000070" stroke-width="5" paint-order="stroke">PRASANA KUMAR A</text>
  <text x="600" y="116" text-anchor="middle" font-family="Courier New, monospace" font-weight="bold"
        font-size="16" fill="#ffe259" stroke="#00000070" stroke-width="2" paint-order="stroke">LEVEL 99 · DEVOPS ARCHITECT · TECH4GOOD FELLOW</text>

  <!-- blocks -->
  <rect x="380" y="150" width="40" height="40" fill="#c84c0c" stroke="#5a2200" stroke-width="3"/>
  <g>
    <rect x="440" y="150" width="40" height="40" fill="#f7b733" stroke="#8a5200" stroke-width="3"/>
    <text x="460" y="178" text-anchor="middle" font-family="Courier New, monospace" font-weight="bold" font-size="22" fill="#5a2200">?</text>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" keyTimes="0;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </g>
  <rect x="500" y="150" width="40" height="40" fill="#c84c0c" stroke="#5a2200" stroke-width="3"/>

  <!-- spinning coin -->
  <g transform="translate(460 118)">
    <ellipse cx="0" cy="0" rx="10" ry="10" fill="#ffd54a" stroke="#8a5200" stroke-width="2"/>
    <animateTransform attributeName="transform" type="scale" additive="sum" values="1 1;0.15 1;1 1" keyTimes="0;0.5;1" dur="0.9s" repeatCount="indefinite"/>
  </g>

  <!-- pipe -->
  <rect x="1000" y="190" width="70" height="60" fill="#3cb043" stroke="#1c6b23" stroke-width="3"/>
  <rect x="990" y="175" width="90" height="22" fill="#4fd15b" stroke="#1c6b23" stroke-width="3"/>

  <!-- ground -->
  <rect x="0" y="250" width="1200" height="50" fill="url(#brick)"/>

  <!-- running pixel hero -->
  <g id="hero">
    <g transform="scale(2.6)">
      <rect x="4" y="18" width="4" height="6" fill="#274690"/>
      <rect x="10" y="18" width="4" height="6" fill="#274690">
        <animate attributeName="y" values="18;15;18" keyTimes="0;0.5;1" dur="0.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="3" y="10" width="12" height="8" fill="#2f9e44"/>
      <rect x="1" y="10" width="3" height="6" fill="#2f9e44"/>
      <rect x="14" y="10" width="3" height="6" fill="#2f9e44"/>
      <rect x="4" y="4" width="10" height="7" fill="#ffd9a0"/>
      <rect x="3" y="1" width="12" height="4" fill="#d92b2b"/>
      <rect x="12" y="4" width="4" height="2" fill="#d92b2b"/>
    </g>
    <animateMotion path="M -60 232 L 1260 232" dur="9s" repeatCount="indefinite"/>
  </g>
</svg>
