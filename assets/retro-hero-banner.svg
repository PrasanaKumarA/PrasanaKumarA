<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a88f7" />
      <stop offset="60%" stop-color="#64a1ff" />
      <stop offset="100%" stop-color="#8cb8ff" />
    </linearGradient>

    <!-- Ground Brick Pattern -->
    <pattern id="groundPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#d05010" />
      <rect x="0" y="0" width="20" height="10" fill="#b04000" />
      <rect x="0" y="0" width="19" height="9" fill="#d05010" />
      <rect x="10" y="10" width="10" height="10" fill="#b04000" />
      <rect x="10" y="10" width="9" height="9" fill="#d05010" />
      <!-- Grid lines -->
      <line x1="0" y1="0" x2="20" y2="0" stroke="#000000" stroke-width="1" opacity="0.4" />
      <line x1="0" y1="10" x2="20" y2="10" stroke="#000000" stroke-width="1" opacity="0.4" />
      <line x1="0" y1="0" x2="0" y2="20" stroke="#000000" stroke-width="1" opacity="0.4" />
      <line x1="10" y1="10" x2="10" y2="20" stroke="#000000" stroke-width="1" opacity="0.4" />
    </pattern>

    <!-- Brick Texture -->
    <pattern id="brickPattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#b84400" />
      <rect x="1" y="1" width="14" height="6" fill="#d85818" />
      <rect x="1" y="9" width="6" height="6" fill="#d85818" />
      <rect x="9" y="9" width="6" height="6" fill="#d85818" />
      <line x1="0" y1="0" x2="16" y2="0" stroke="#000000" stroke-width="1" />
      <line x1="0" y1="8" x2="16" y2="8" stroke="#000000" stroke-width="1" />
      <line x1="8" y1="8" x2="8" y2="16" stroke="#000000" stroke-width="1" />
    </pattern>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
      
      .pixel-title {
        font-family: 'Press Start 2P', monospace;
        font-size: 26px;
        fill: #ffffff;
        text-anchor: middle;
        font-weight: bold;
      }
      
      .pixel-sub {
        font-family: 'Press Start 2P', monospace;
        font-size: 11px;
        fill: #fbd000;
        text-anchor: middle;
        font-weight: bold;
      }
      
      /* Cloud Floating */
      .cloud {
        animation: floatCloud 24s linear infinite;
      }
      .cloud-2 {
        animation: floatCloud 36s linear infinite;
        animation-delay: -12s;
      }
      @keyframes floatCloud {
        0% { transform: translateX(850px); }
        100% { transform: translateX(-200px); }
      }

      /* Coin Bouncing Animation */
      .coin {
        animation: coinBounce 1.2s ease-in-out infinite alternate;
      }
      @keyframes coinBounce {
        0% { transform: translateY(0px) scaleX(1); }
        50% { transform: translateY(-12px) scaleX(0.2); }
        100% { transform: translateY(-24px) scaleX(1); }
      }

      /* Question Block Glow */
      .q-block {
        animation: qGlow 1.5s ease-in-out infinite alternate;
      }
      @keyframes qGlow {
        0% { fill: #fbd000; }
        100% { fill: #ffea79; }
      }
    </style>
  </defs>

  <!-- SKY BACKGROUND -->
  <rect width="800" height="240" fill="url(#skyGrad)" />

  <!-- DRIFTING PIXEL CLOUDS -->
  <g class="cloud">
    <path d="M0 40 h60 v15 h-60 z M15 25 h30 v30 h-30 z M10 30 h40 v20 h-40 z" fill="#ffffff" opacity="0.85" />
  </g>
  <g class="cloud-2">
    <path d="M0 60 h80 v20 h-80 z M20 40 h40 v40 h-40 z M10 50 h60 v30 h-60 z" fill="#ffffff" opacity="0.7" />
  </g>

  <!-- MARIO GROUND -->
  <rect x="0" y="195" width="800" height="45" fill="url(#groundPattern)" />
  <line x1="0" y1="195" x2="800" y2="195" stroke="#000000" stroke-width="3" />
  <line x1="0" y1="198" x2="800" y2="198" stroke="#000000" stroke-width="1" opacity="0.5" />

  <!-- TITLE TEXT -->
  <!-- Text Shadow / Stroke for Pixel Readability -->
  <text x="402" y="77" class="pixel-title" fill="#000000">PRASANA KUMAR A</text>
  <text x="398" y="73" class="pixel-title" fill="#000000">PRASANA KUMAR A</text>
  <text x="400" y="75" class="pixel-title">PRASANA KUMAR A</text>

  <!-- SUBTITLE TEXT -->
  <text x="401" y="106" class="pixel-sub" fill="#000000">LEVEL 10 DEVOPS ARCHITECT - TECH4GOOD FELLOW</text>
  <text x="400" y="105" class="pixel-sub">LEVEL 10 DEVOPS ARCHITECT - TECH4GOOD FELLOW</text>

  <!-- BOUNCING COIN ABOVE QUESTION BLOCK -->
  <g transform="translate(346, 115)">
    <g class="coin">
      <ellipse cx="6" cy="6" rx="6" ry="9" fill="#fbd000" stroke="#000000" stroke-width="1.5" />
      <ellipse cx="6" cy="6" rx="3" ry="6" fill="#ffe600" />
      <line x1="6" y1="2" x2="6" y2="10" stroke="#d0a000" stroke-width="1" />
    </g>
  </g>

  <!-- BRICK & QUESTION BLOCKS (CENTERED) -->
  <!-- Left Brick Block -->
  <g transform="translate(306, 135)">
    <rect width="36" height="36" fill="url(#brickPattern)" stroke="#000000" stroke-width="2.5" />
  </g>

  <!-- Middle Question Block -->
  <g transform="translate(346, 135)">
    <rect width="36" height="36" class="q-block" stroke="#000000" stroke-width="2.5" rx="2" />
    <!-- Inner corner dots -->
    <rect x="3" y="3" width="3" height="3" fill="#000000" />
    <rect x="30" y="3" width="3" height="3" fill="#000000" />
    <rect x="3" y="30" width="3" height="3" fill="#000000" />
    <rect x="30" y="30" width="3" height="3" fill="#000000" />
    <!-- Question Mark '?' -->
    <path d="M13 10 h10 v4 h-4 v4 h-4 v4 h4 v-2 h4 v-6 h-4 v-2 h-6 z M15 24 h4 v4 h-4 z" fill="#000000" />
  </g>

  <!-- Right Brick Block -->
  <g transform="translate(386, 135)">
    <rect width="36" height="36" fill="url(#brickPattern)" stroke="#000000" stroke-width="2.5" />
  </g>

  <!-- WARP PIPE (RIGHT SIDE) -->
  <g transform="translate(680, 145)">
    <!-- Pipe Top Rim -->
    <rect x="0" y="0" width="64" height="18" fill="#00c800" stroke="#000000" stroke-width="2.5" rx="2" />
    <rect x="4" y="2" width="12" height="14" fill="#50ff50" opacity="0.8" />
    <rect x="48" y="2" width="12" height="14" fill="#008000" opacity="0.6" />

    <!-- Pipe Body -->
    <rect x="4" y="18" width="56" height="34" fill="#00c800" stroke="#000000" stroke-width="2.5" />
    <rect x="8" y="18" width="10" height="34" fill="#50ff50" opacity="0.8" />
    <rect x="46" y="18" width="10" height="34" fill="#008000" opacity="0.6" />
  </g>

</svg>
