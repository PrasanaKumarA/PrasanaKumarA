<svg viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Retro Arcade Sky Gradient -->
    <linearGradient id="retroSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a86ff"/>
      <stop offset="60%" stop-color="#4895ef"/>
      <stop offset="100%" stop-color="#80b918"/>
    </linearGradient>

    <!-- Ground Brick Pattern -->
    <pattern id="marioBrick" width="40" height="24" patternUnits="userSpaceOnUse">
      <rect width="40" height="24" fill="#b03a00"/>
      <!-- Bricks top row -->
      <rect x="1" y="1" width="18" height="10" fill="#d94e00"/>
      <rect x="21" y="1" width="18" height="10" fill="#d94e00"/>
      <!-- Bricks bottom row -->
      <rect x="1" y="13" width="8" height="10" fill="#d94e00"/>
      <rect x="11" y="13" width="18" height="10" fill="#d94e00"/>
      <rect x="31" y="13" width="8" height="10" fill="#d94e00"/>
      <!-- Mortar lines -->
      <line x1="0" y1="0" x2="40" y2="0" stroke="#000000" stroke-width="2"/>
      <line x1="0" y1="12" x2="40" y2="12" stroke="#000000" stroke-width="2"/>
      <line x1="20" y1="0" x2="20" y2="12" stroke="#000000" stroke-width="2"/>
      <line x1="10" y1="12" x2="10" y2="24" stroke="#000000" stroke-width="2"/>
      <line x1="30" y1="12" x2="30" y2="24" stroke="#000000" stroke-width="2"/>
    </pattern>

    <!-- Question Block Pattern -->
    <linearGradient id="qBlockGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffea00"/>
      <stop offset="100%" stop-color="#ffaa00"/>
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
      
      .title-text {
        font-family: 'Press Start 2P', monospace;
        font-size: 36px;
        fill: #ffffff;
        text-anchor: middle;
      }
      
      .subtitle-text {
        font-family: 'Press Start 2P', monospace;
        font-size: 14px;
        fill: #ffea00;
        text-anchor: middle;
      }

      /* Animated Drifting Clouds */
      .cloud-bg-1 {
        animation: floatRight 28s linear infinite;
      }
      .cloud-bg-2 {
        animation: floatLeft 34s linear infinite;
      }
      @keyframes floatRight {
        0% { transform: translateX(-200px); }
        100% { transform: translateX(1300px); }
      }
      @keyframes floatLeft {
        0% { transform: translateX(1300px); }
        100% { transform: translateX(-200px); }
      }

      /* Animated Bouncing Coin */
      .bouncing-coin {
        animation: coinJump 1.2s ease-in-out infinite alternate;
      }
      @keyframes coinJump {
        0% { transform: translateY(0px) scaleX(1); }
        50% { transform: translateY(-16px) scaleX(0.2); }
        100% { transform: translateY(-32px) scaleX(1); }
      }

      /* Pulsing Question Block */
      .q-box {
        animation: boxPulse 1.5s ease-in-out infinite alternate;
      }
      @keyframes boxPulse {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-3px); }
      }
    </style>
  </defs>

  <!-- SKY BACKGROUND -->
  <rect width="1200" height="230" fill="url(#retroSky)"/>

  <!-- DRIFTING PIXEL CLOUDS -->
  <g class="cloud-bg-1" fill="#ffffff" opacity="0.9">
    <ellipse cx="100" cy="50" rx="35" ry="16"/>
    <ellipse cx="125" cy="45" rx="25" ry="18"/>
    <ellipse cx="75" cy="48" rx="22" ry="14"/>
  </g>
  <g class="cloud-bg-2" fill="#ffffff" opacity="0.8">
    <ellipse cx="900" cy="65" rx="45" ry="18"/>
    <ellipse cx="935" cy="58" rx="30" ry="20"/>
    <ellipse cx="865" cy="62" rx="28" ry="15"/>
  </g>

  <!-- TITLE & SUBTITLE WITH PIXEL OUTLINE -->
  <text x="604" y="84" class="title-text" fill="#000000">PRASANA KUMAR A</text>
  <text x="596" y="76" class="title-text" fill="#000000">PRASANA KUMAR A</text>
  <text x="600" y="80" class="title-text">PRASANA KUMAR A</text>

  <text x="602" y="112" class="subtitle-text" fill="#000000">LVL 99 · DEVOPS ARCHITECT · TECH4GOOD FELLOW</text>
  <text x="600" y="110" class="subtitle-text">LVL 99 · DEVOPS ARCHITECT · TECH4GOOD FELLOW</text>

  <!-- BOUNCING GOLD COIN ABOVE QUESTION BLOCK -->
  <g transform="translate(600, 118)">
    <g class="bouncing-coin">
      <ellipse cx="0" cy="0" rx="10" ry="12" fill="#ffea00" stroke="#000000" stroke-width="2"/>
      <ellipse cx="0" cy="0" rx="5" ry="8" fill="#fff59d"/>
      <line x1="0" y1="-5" x2="0" y2="5" stroke="#d4a300" stroke-width="1.5"/>
    </g>
  </g>

  <!-- PLATFORMER BLOCKS (CENTERED) -->
  <!-- Left Brick -->
  <rect x="520" y="145" width="42" height="42" fill="#d94e00" stroke="#000000" stroke-width="3" rx="2"/>
  <rect x="524" y="149" width="16" height="14" fill="#ff7b3d"/>
  <rect x="542" y="149" width="16" height="14" fill="#ff7b3d"/>
  <rect x="524" y="167" width="34" height="14" fill="#ff7b3d"/>

  <!-- Question Block -->
  <g class="q-box">
    <rect x="579" y="145" width="42" height="42" fill="url(#qBlockGrad)" stroke="#000000" stroke-width="3" rx="3"/>
    <rect x="583" y="149" width="4" height="4" fill="#ffffff"/>
    <rect x="613" y="149" width="4" height="4" fill="#ffffff"/>
    <rect x="583" y="179" width="4" height="4" fill="#000000"/>
    <rect x="613" y="179" width="4" height="4" fill="#000000"/>
    <text x="600" y="174" text-anchor="middle" font-family="'Press Start 2P', monospace" font-size="24" font-weight="bold" fill="#000000">?</text>
  </g>

  <!-- Right Brick -->
  <rect x="638" y="145" width="42" height="42" fill="#d94e00" stroke="#000000" stroke-width="3" rx="2"/>
  <rect x="642" y="149" width="16" height="14" fill="#ff7b3d"/>
  <rect x="660" y="149" width="16" height="14" fill="#ff7b3d"/>
  <rect x="642" y="167" width="34" height="14" fill="#ff7b3d"/>

  <!-- GREEN WARP PIPE (RIGHT SIDE) -->
  <g transform="translate(1040, 150)">
    <!-- Pipe Top Rim -->
    <rect x="0" y="0" width="80" height="24" fill="#38b000" stroke="#000000" stroke-width="3" rx="2"/>
    <rect x="5" y="3" width="15" height="18" fill="#70e000" opacity="0.8"/>
    <rect x="60" y="3" width="15" height="18" fill="#007200" opacity="0.6"/>

    <!-- Pipe Stem -->
    <rect x="6" y="24" width="68" height="56" fill="#38b000" stroke="#000000" stroke-width="3"/>
    <rect x="11" y="24" width="12" height="56" fill="#70e000" opacity="0.8"/>
    <rect x="56" y="24" width="12" height="56" fill="#007200" opacity="0.6"/>
  </g>

  <!-- GROUND (BRICK PATTERN) -->
  <rect x="0" y="230" width="1200" height="50" fill="url(#marioBrick)"/>
  <line x1="0" y1="230" x2="1200" y2="230" stroke="#000000" stroke-width="4"/>

  <!-- RUNNING MARIO HERO ANIMATION -->
  <g id="runningMario">
    <g transform="scale(2.2)">
      <!-- Shoes -->
      <rect x="4" y="20" width="5" height="4" fill="#703800"/>
      <rect x="11" y="20" width="5" height="4" fill="#703800">
        <animate attributeName="y" values="20;17;20" keyTimes="0;0.5;1" dur="0.3s" repeatCount="indefinite"/>
      </rect>
      <!-- Overalls -->
      <rect x="4" y="11" width="12" height="9" fill="#0038a8"/>
      <rect x="7" y="13" width="2" height="2" fill="#ffcc00"/>
      <rect x="11" y="13" width="2" height="2" fill="#ffcc00"/>
      <!-- Red Shirt -->
      <rect x="2" y="11" width="4" height="6" fill="#e52521"/>
      <rect x="14" y="11" width="4" height="6" fill="#e52521"/>
      <!-- Face & Mustache -->
      <rect x="4" y="4" width="11" height="7" fill="#ffcca0"/>
      <rect x="10" y="7" width="5" height="3" fill="#000000"/>
      <rect x="11" y="5" width="2" height="2" fill="#000000"/>
      <!-- Red Cap -->
      <rect x="4" y="1" width="12" height="4" fill="#e52521"/>
      <rect x="13" y="4" width="5" height="2" fill="#e52521"/>
    </g>
    <animateMotion path="M -80 207 L 1280 207" dur="8.5s" repeatCount="indefinite"/>
  </g>
</svg>
